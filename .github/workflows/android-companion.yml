name: PicoCalc Android companion
on:
  push:
    paths:
      - 'android-companion/**'
      - 'Code/picocalc_android_bridge/**'
      - '.github/workflows/android-companion.yml'
  pull_request:
    paths:
      - 'android-companion/**'
      - 'Code/picocalc_android_bridge/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK, AAB, and run unit tests
        run: gradle assembleDebug bundleRelease testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: picocalc-companion-android
          path: |
            android-companion/app/build/outputs/apk/debug/*.apk
            android-companion/app/build/outputs/bundle/release/*.aab
